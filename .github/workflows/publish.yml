name: Publish image

# Pushing a version tag such as v0.1.0 publishes ghcr.io/<owner>/regex3:0.1.0 (and 0.1, and latest).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to GitHub Container Registry
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "The tag is $GITHUB_REF_NAME but package.json says $expected. Update one of them and tag again." >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # 1.2.3 also publishes 1.2 and, from version 1 on, 1. "latest" is added for stable releases.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
