server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 256;
  gzip_types text/css application/javascript image/svg+xml;

  # Everything the app needs is served from this origin; it makes no network requests of its own.
  # Note: add_header in a nested block replaces these, so the blocks below use `expires` instead.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;

  # Hashed build output never changes under the same name.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Fonts keep their names between releases, so they get a shorter lifetime than the hashed assets.
  location /fonts/ {
    expires 30d;
    try_files $uri =404;
  }

  location = /index.html {
    expires -1;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    try_files $uri $uri/index.html =404;
  }
}
